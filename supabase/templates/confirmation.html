<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TagNoteへようこそ</title>
  </head>
  <body style="margin: 0; background: #f7f7f9; color: #18191d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="padding: 40px 16px;">
          <table role="presentation" style="width: 100%; max-width: 520px; margin: 0 auto; border: 1px solid #e6e6e9; border-radius: 20px; background: #ffffff;">
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 24px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">TagNote</p>
                <h1 style="margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -0.04em;">TagNoteへようこそ</h1>
                <p style="margin: 16px 0 0; color: #65666d; font-size: 15px; line-height: 1.8;">サインアップを完了するため、次のボタンからメールアドレスを確認してください。</p>
                <p style="margin: 28px 0;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=%2F%3Ftoast%3Dsigned-up" style="display: inline-block; border-radius: 12px; background: #18191d; color: #ffffff; font-size: 14px; font-weight: 700; padding: 13px 20px; text-decoration: none;">メールアドレスを確認する</a>
                </p>
                <p style="margin: 0; color: #65666d; font-size: 13px; line-height: 1.7;">このリンクは一度だけ使用できます。このメールに心当たりがない場合は、そのまま破棄してください。</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
